name: Update NFF calendar feed
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and convert NFF calendar
        run: python scripts/sync_calendar.py
      - name: Commit changed calendar data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matches.json
          if ! git diff --cached --quiet; then
            git commit -m "Update NFF calendar data"
            git push
          else
            echo "No calendar changes"
          fi
